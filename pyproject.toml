[project]
name = "uvl-fuse"
version = "0.0.2"
description = "Virtual dependency directories for package managers, backed by a shared FUSE store."
dependencies = []
requires-python = ">=3.8"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.md" }

[project.scripts]
uvl = "uvl._cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["uvl"]

[tool.setuptools.package-data]
uvl = ["bin/uvl"]

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"
skip = "*-musllinux_* pp*"
test-command = "uvl --version"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-build = """
dnf install -y fuse3-devel openssl-devel
python -m pip install cmake
rm -rf build python/uvl/bin
make build
test -x build/uvl
mkdir -p python/uvl/bin
cp build/uvl python/uvl/bin/uvl
chmod +x python/uvl/bin/uvl
"""