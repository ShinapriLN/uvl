[project]
name = "uvl"
version = "0.0.1"
description = "Virtual dependency directories for package managers, backed by a shared FUSE store."
dependencies = []
requires-python = ">=3.8"

[project.scripts]
uvl = "uvl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvl"]
artifacts = ["src/uvl/native/fuse.c", "src/uvl/native/uvl.c"]
