[project]
name = "uvl-fuse"
version = "0.0.1"
description = "Virtual dependency directories for package managers, backed by a shared FUSE store."
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = []
requires-python = ">=3.8"

[project.scripts]
uvl = "uvl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvl"]
force-include = { "build/uvl" = "uvl/native/uvl" }
pure_python = false
tag = "py3-none-linux_x86_64"
artifacts = ["src/uvl/native/fuse.c", "src/uvl/native/uvl.c"]
